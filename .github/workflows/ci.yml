name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      external_demo:
        description: Optional public-service demo
        type: choice
        default: none
        options: [none, jsonplaceholder, wikipedia]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install core and developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Robot and Python sources
        run: |
          robocop check .
          robocop format --check .
          ruff check .
          ruff format --check .
          python scripts/check_docs.py
      - name: Generate 7.5 library documentation
        run: |
          python -m robot.libdoc libraries/example_library.py output/libdoc/example_library.html
          python -m robot.libdoc libraries/example_library.py output/libdoc/example_library.md
      - uses: actions/upload-artifact@v7
        with:
          name: example-library-docs
          path: output/libdoc/
          retention-days: 7

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python-only runtime
        run: python -m pip install -r requirements.txt
      - name: Run features, executable Markdown, API, and SQLite examples
        run: python -m robot --pythonpath . --loglevel TRACE --outputdir output/core --xunit xunit.xml tests/features tests/api tests/database
      - name: Demonstrate JSON output and Rebot console configuration
        run: python -m robot.rebot --console dotted --output output/core/results.json --log NONE --report NONE output/core/output.xml
      - name: Check secret masking through success and failure paths
        run: python scripts/check_secret_artifacts.py output/core
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robot-core-${{ matrix.os }}
          path: output/core/
          retention-days: 7

  ui:
    name: Local UI and journey
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ui.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Browser and its matching Chromium dependencies
        run: |
          python -m pip install -r requirements-ui.txt
          rfbrowser init --with-deps chromium
      - name: Run local browser and API to UI to SQLite journey
        run: python -m robot --pythonpath . --outputdir output/ui tests/ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robot-ui-results
          path: output/ui/
          retention-days: 7

  docker:
    name: Docker core and UI smoke checks
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Build and run Python-only image
        run: |
          docker build --target core -t rf-template:core .
          docker run --rm -v "${PWD}/output/docker-core:/workspace/output" rf-template:core
      - name: Build and run Browser image
        run: |
          docker build --target ui -t rf-template:ui .
          docker run --rm -v "${PWD}/output/docker-ui:/workspace/output" rf-template:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robot-docker-results
          path: output/docker-*/
          retention-days: 7

  external-demo:
    name: Optional external demo
    if: github.event_name == 'workflow_dispatch' && inputs.external_demo != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install core runtime
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        if: inputs.external_demo == 'wikipedia'
        with:
          node-version: "24"
      - name: Install optional UI runtime
        if: inputs.external_demo == 'wikipedia'
        run: |
          python -m pip install -r requirements-ui.txt
          rfbrowser init --with-deps chromium
      - name: Run the explicitly selected public-service example
        env:
          DEMO: ${{ inputs.external_demo }}
        run: python -m robot --pythonpath . --outputdir output/external "examples/external/$DEMO"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robot-external-results
          path: output/external/
          retention-days: 7
