repos:
  - repo: https://github.com/MarketSquare/robotframework-robocop
    rev: v8.6.0
    hooks:
      - id: robocop
        args:
          - --reports
          - all
      - id: robocop-format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      - id: ruff
        args: ["--fix"]
