[tool.robocop.lint]
reports = [
    "all",
]
# This template intentionally uses sentence-case keyword names for readability.
# Robocop's default Title Case / no-underscore naming rules are disabled for that reason.
ignore = [
    "NAME02",
    "NAME04",
    "NAME18",
]

[tool.robocop.format]
line_length = 120

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "preserve"
